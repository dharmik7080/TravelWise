{% extends 'base.html' %}
{% block title %}System Error | GlobeTrotter{% endblock %}

{% block content %}
<div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
    <div class="row justify-content-center w-100 py-5">
        <div class="col-md-6 text-center card p-5 rounded-4 shadow-sm border" style="background-color: #1e293b !important; border-color: rgba(255, 255, 255, 0.08) !important;">
            <div class="text-danger mb-4">
                <i class="fa-solid fa-triangle-exclamation fa-4x text-danger animate-bounce"></i>
            </div>
            <h1 class="display-3 fw-bold text-white mb-2">500</h1>
            <h3 class="fw-bold">Turbulence Ahead</h3>
            <p class="text-muted px-md-4 mt-2">The server encountered an unexpected error. Please hold tight while we work to restore our course.</p>
            <div class="mt-4">
                <a href="{% url 'home' %}" class="btn btn-primary px-4 py-2"><i class="fa-solid fa-house me-2"></i>Go Home</a>
                <a href="{% url 'destinations:list' %}" class="btn btn-outline-light px-4 py-2 ms-2"><i class="fa-solid fa-earth-americas me-2"></i>Explore Sights</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
